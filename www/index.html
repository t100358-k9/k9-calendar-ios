<script>

/* ================= K9 Database V1 ================= */
const K9DB = (() => {
  const KEY = "K9_DATABASE_V1";
  const LEGACY_CALENDAR_KEY = "K9_OFFICIAL_STATION_DB_V4";
  const LEGACY_SHIFT_KEY = "K9_SHIFT_DATA";
  const VERSION = 1;
  const nowISO = () => new Date().toISOString();

  function parse(v, fallback) {
    try { const x = JSON.parse(v); return x ?? fallback; }
    catch(e) { return fallback; }
  }

  function emptyDB() {
    const now = nowISO();
    return {
      schemaVersion: VERSION,
      databaseVersion: "1.0.0",
      createdAt: now,
      updatedAt: now,
      dogs: [],
      handlers: [],
      calendarRecords: [],
      trainingRecords: [],
      odorRecords: [],
      healthRecords: [],
      reminders: [],
      settings: {}
    };
  }

  let db = null;

  function normalize(x) {
    const b = emptyDB();
    const s = (x && typeof x === "object") ? x : {};
    return {
      ...b, ...s,
      schemaVersion: VERSION,
      dogs: Array.isArray(s.dogs) ? s.dogs : [],
      handlers: Array.isArray(s.handlers) ? s.handlers : [],
      calendarRecords: Array.isArray(s.calendarRecords) ? s.calendarRecords : [],
      trainingRecords: Array.isArray(s.trainingRecords) ? s.trainingRecords : [],
      odorRecords: Array.isArray(s.odorRecords) ? s.odorRecords : [],
      healthRecords: Array.isArray(s.healthRecords) ? s.healthRecords : [],
      reminders: Array.isArray(s.reminders) ? s.reminders : [],
      settings: (s.settings && typeof s.settings === "object") ? s.settings : {}
    };
  }

  function save() {
    db.updatedAt = nowISO();
    localStorage.setItem(KEY, JSON.stringify(db));
  }

  function init() {
    const existing = localStorage.getItem(KEY);

    if (existing) {
      db = normalize(parse(existing, emptyDB()));
      save();
      return db;
    }

    db = emptyDB();

    // 非破壞式遷移：只複製舊資料，不刪除舊資料。
    const legacyCalendar = parse(
      localStorage.getItem(LEGACY_CALENDAR_KEY) || "[]", []
    );

    if (Array.isArray(legacyCalendar)) {
      db.calendarRecords = legacyCalendar.map((a, i) => ({
        id: "CAL-MIGRATED-" + Date.now() + "-" + i,
        date: a && a.date ? a.date : "",
        data: a && Array.isArray(a.data) ? a.data : [],
        source: "legacy-v4",
        migratedAt: nowISO()
      }));
    }

    const legacyShift = parse(
      localStorage.getItem(LEGACY_SHIFT_KEY) || "{}", {}
    );

    if (legacyShift && typeof legacyShift === "object") {
      db.settings.calendarShiftData = legacyShift;
    }

    db.settings.legacyCalendarMigrated = true;
    db.settings.legacyShiftMigrated = true;
    save();
    return db;
  }

  function ensure() {
    if (!db) init();
    return db;
  }

  function makeId(prefix) {
    return prefix + "-" + Date.now() + "-" +
      Math.random().toString(36).slice(2, 8);
  }

  const calendar = {
    getAll() {
      return ensure().calendarRecords;
    },

    // 保持目前 Calendar 使用的 archive 結構：[{date, data:[...]}]
    getArchives() {
      return ensure().calendarRecords.map(r => ({
        date: r.date || "",
        data: Array.isArray(r.data) ? r.data : []
      }));
    },

    get(id) {
      return ensure().calendarRecords.find(r => r.id === id) || null;
    },

    save(record) {
      ensure();

      const r = {
        id: record && record.id ? record.id : makeId("CAL"),
        date: record && record.date ? record.date : "",
        data: record && Array.isArray(record.data) ? record.data : [],
        source: record && record.source ? record.source : "k9db",
        updatedAt: nowISO()
      };

      const i = db.calendarRecords.findIndex(x => x.id === r.id);

      if (i >= 0) {
        db.calendarRecords[i] = { ...db.calendarRecords[i], ...r };
      } else {
        db.calendarRecords.push(r);
      }

      save();
      return r;
    },

    remove(id) {
      ensure();
      db.calendarRecords = db.calendarRecords.filter(r => r.id !== id);
      save();
    }
  };

  const settings = {
    get(key, fallback = null) {
      const v = ensure().settings[key];
      return v === undefined ? fallback : v;
    },

    set(key, value) {
      ensure().settings[key] = value;
      save();
      return value;
    }
  };

  return {
    KEY,
    VERSION,
    init,
    calendar,
    settings,
    dogs: {
      getAll() { return ensure().dogs; }
    },
    handlers: {
      getAll() { return ensure().handlers; }
    },
    training: {
      getAll() { return ensure().trainingRecords; }
    },
    odor: {
      getAll() { return ensure().odorRecords; }
    },
    health: {
      getAll() { return ensure().healthRecords; }
    },
    reminders: {
      getAll() { return ensure().reminders; }
    }
  };
})();

K9DB.init();

</script>

         // K9DB V1：Calendar 統一由 K9DB 資料層讀取。
// 舊版 LocalStorage 仍保留，作為相容與備援。
const DB_KEY = K9DB.KEY;

/* =========================
   Calendar DB 讀取函式
   ========================= */
function getCalendarDB(){
    try{
        const archives = K9DB.calendar.getArchives();

        if(Array.isArray(archives) && archives.length){
            return archives;
        }

        // 若 K9DB V1 尚無資料，保留 Legacy V4 作為備援。
        const legacy = JSON.parse(
            localStorage.getItem("K9_OFFICIAL_STATION_DB_V4") || "[]"
        );

        return Array.isArray(legacy) ? legacy : [];

    }catch(error){
        console.error("[K9 Calendar] Calendar DB 讀取失敗：", error);

        try{
            const legacy = JSON.parse(
                localStorage.getItem("K9_OFFICIAL_STATION_DB_V4") || "[]"
            );
            return Array.isArray(legacy) ? legacy : [];
        }catch(e){
            return [];
        }
    }
}

let db = getCalendarDB();

const SHIFT_KEY = "K9_SHIFT_DATA";

/* =========================================================
   K9DB V1：Calendar 班表資料層
   主來源：K9DB.settings.calendarShiftData
   Legacy K9_SHIFT_DATA 僅作第一次遷移／備援，不再作為主要來源。
   ========================================================= */
function getCalendarShiftData(){

    let v1Shift = {};
    let legacyShift = {};

    /* ① 讀取 K9DB V1 */
    try{
        const value = K9DB.settings.get(
            "calendarShiftData",
            null
        );

        if(
            value &&
            typeof value === "object" &&
            !Array.isArray(value)
        ){
            v1Shift = value;
        }
    }catch(error){
        console.warn(
            "[K9 Calendar] K9DB V1 班表讀取失敗：",
            error
        );
    }

    /* ② 讀取 Legacy 班表
       目前 index.html 的班表匯入仍會寫入 K9_SHIFT_DATA，
       因此這裡必須同步最新 Legacy 資料，避免 K9DB V1
       在第一次遷移後一直停留在舊快照。 */
    try{
        const legacy = JSON.parse(
            localStorage.getItem(SHIFT_KEY) || "{}"
        );

        if(
            legacy &&
            typeof legacy === "object" &&
            !Array.isArray(legacy)
        ){
            legacyShift = legacy;
        }
    }catch(error){
        console.warn(
            "[K9 Calendar] Legacy 班表讀取失敗：",
            error
        );
    }

    /* ③ Legacy 有資料時，以最新 Legacy 為優先，
          同時寫回 K9DB V1。 */
    if(Object.keys(legacyShift).length > 0){

        const mergedShift = {
            ...v1Shift,
            ...legacyShift
        };

        try{
            K9DB.settings.set(
                "calendarShiftData",
                mergedShift
            );
        }catch(error){
            console.warn(
                "[K9 Calendar] 班表同步至 K9DB V1 失敗：",
                error
            );
        }

        return mergedShift;
    }

    /* ④ Legacy 沒有資料時，使用 K9DB V1 */
    return v1Shift;
}

         function getMonthlyWorkRewardRatio(year, month){

             const monthPrefix =
                 `${year}-${String(month + 1).padStart(2,"0")}-`;

             let totalTimes = 0;
             let trueScent = 0;
             let falseScent = 0;

             db.forEach(archive => {

                 if(!archive.date || !archive.date.startsWith(monthPrefix))
                     return;

                 if(!Array.isArray(archive.data))
                     return;

                 archive.data.forEach(record => {

                     // 每一筆勤務紀錄計 1 次工作次數
                     totalTimes++;

                     const scentType =
                         record.scent && record.scent.type
                         ? String(record.scent.type).trim()
                         : "";

                     if(["H","C","K","M","A","T"].includes(scentType)){
                         trueScent++;
                     }
                     else if(["Cs","Ms","M/O"].includes(scentType)){
                         falseScent++;
                     }

                 });

             });

             const scentTotal = trueScent + falseScent;

             return {
                 totalTimes,
                 trueScent,
                 falseScent,
                 scentTotal,
                 ratio: scentTotal > 0
                     ? (totalTimes / scentTotal).toFixed(2)
                     : "0.00"
             };
         }

                 if(/^T[123](?:$|[－\-\s])/i.test(x)){counts.airport++;return;}

                 if(/^(遠雄|榮儲|華儲)[－\-](理貨區|驗貨區)/.test(x)||/^(DHL|FEDEX|UPS)(?:$|[－\-\s])/i.test(x)){counts.expressCargo++;return;}
                 if(["郵局－航郵出口","郵局-航郵出口","郵局－航郵進口","郵局-航郵進口"].includes(x)){counts.airmail++;return;}
                 if(["郵局－林口郵政園區","郵局-林口郵政園區"].includes(x)){counts.northPost++;return;}
             }); return counts;
         }

         function getShiftRecordClass(date){

             const shift = shiftData?.[date] || "";

             if(shift === "D"){
                 return "shift-record-d";
             }

             if(shift === "DM"){
                 return "shift-record-dm";
             }

             if(shift === "OFF"){
                 return "shift-record-off";
             }

             return "";
         }

         /* =========================
            同一天所有勤務資料統一依時間排序
            → 月曆時間軸、右側勤務卡片、任務詳細內容
              必須使用同一份排序結果，避免點擊後資料對不起來
         ========================= */
         function getSortedDayEvents(date){
             return events
                 .map((event, originalIndex) => ({ event, originalIndex }))
                 .filter(item => item.event.date === date)
                 .sort((a,b)=>{
                     const toMinutes = (time)=>{
                         const match = String(time || "").trim().match(/^(\d{1,2}):(\d{2})/);
                         if(!match) return Number.MAX_SAFE_INTEGER;
                         return Number(match[1]) * 60 + Number(match[2]);
                     };

                     const timeDiff = toMinutes(a.event.time) - toMinutes(b.event.time);

                     // 相同時間維持原始資料順序，避免資料被重新打亂
                     return timeDiff !== 0
                         ? timeDiff
                         : a.originalIndex - b.originalIndex;
                 })
                 .map(item => item.event);
         }

             const shiftLabel = shiftData?.[date] || "未排班";

             let html = `
                <div class="timeline-wrap">

                   ${renderDailyLocationSummary(records)}
                   <div class="timeline">
             `;

             records.forEach((r,index)=>{

                 const score = String(r.score || "").toUpperCase();

                 const nodeClass =
                    score === "G" ? "score-g" :
                    score === "F" ? "score-f" :
                    score === "P" ? "score-p" :
                    score === "FR" ? "score-fr" :
                    score === "DNF" ? "score-dnf" : "";

                 const dogClass =
                    score === "G" ? "dog-g" :
                    score === "F" ? "dog-f" :
                    score === "P" ? "dog-p" :
                    score === "FR" ? "dog-fr" :
                    score === "DNF" ? "dog-dnf" : "dog-none";

                 // 計算與下一筆勤務的時間差，讓時序感更清楚
                 let gapHtml = "";
                 if(index < records.length - 1){
                     const parseMinutes = (time)=>{
                         const m = String(time || "").trim().match(/^(\d{1,2}):(\d{2})/);
                         return m ? Number(m[1]) * 60 + Number(m[2]) : null;
                     };

                     const a = parseMinutes(r.time);
                     const b = parseMinutes(records[index + 1].time);

                     if(a !== null && b !== null && b >= a){
                         const diff = b - a;
                         if(diff > 0){
                             const h = Math.floor(diff / 60);
                             const m = diff % 60;
                             const gapText = h > 0
                                ? `${h} 小時${m ? ` ${m} 分鐘` : ""}`
                                : `${m} 分鐘`;

                             gapHtml = `
                                <div class="timeline-gap">
                                   ↓ 間隔 ${gapText}
                                </div>
                             `;
                         }
                     }
                 }

                 html += `
                    <div class="timeline-item">

                       <div class="timeline-time">
                          ${r.time || "--:--"}
                       </div>

                       <div class="timeline-node-col">
                          <div class="timeline-node ${nodeClass}"></div>
                       </div>

                       <div class="timeline-card ${shiftRecordClass}"
                            onclick="showCard(${index},'${date}')">

                          <div class="timeline-card-top">
                             ${score ? getScoreBadge(score) : ""}

                          <div class="timeline-location">

                          </div>

                          <div class="timeline-mode">
                             🎯 ${r.mode || "—"}
                          </div>

                       </div>

                       ${gapHtml}

                    </div>
                 `;
             });

             html += `
                   </div>
                </div>
             `;

             document.getElementById("dayRecords").innerHTML = html;

             renderMiniCalendar();
         }
